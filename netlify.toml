[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Handy clean URL: /game/some-slug -> game.html?slug=some-slug
[[redirects]]
  from = "/game/:slug"
  to = "/game.html?slug=:slug"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
