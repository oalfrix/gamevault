<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Details — Gamesarena</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<script>
  window.__ENV__ = {
    SUPABASE_URL: "https://YOUR-PROJECT.supabase.co",
    SUPABASE_ANON_KEY: "YOUR-ANON-KEY"
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<header class="nav" id="site-nav"></header>

<div class="wrap">
  <div class="crumbs"><a href="index.html">Store</a> / <span id="crumbTitle">Loading…</span></div>
  <div class="detail" id="detailRoot">
    <div><div class="cover skel" style="aspect-ratio:3/4"></div></div>
    <div><div class="skel" style="height:40px;width:60%"></div></div>
  </div>
</div>

<!-- STK Push payment modal -->
<div class="overlay" id="payOverlay">
  <div class="modal modal-wrap">
    <button class="close-x" id="closeModal" aria-label="Close">✕</button>
    <h3 id="modalGameTitle">Checkout</h3>
    <div class="field">
      <label for="phoneInput">M-Pesa number</label>
      <input id="phoneInput" type="tel" inputmode="numeric" placeholder="0712 345 678" />
    </div>
    <div class="field">
      <label>Amount</label>
      <input id="amountInput" type="text" disabled />
    </div>
    <button class="btn" id="payBtn">Send STK Push</button>
    <div class="status" id="payStatus"></div>
  </div>
</div>

<footer id="site-footer"></footer>

<script type="module" src="js/layout.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
